name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"

      - run: bun install --frozen-lockfile
      - run: bunx tsc -p .
      - run: bun test

      - name: Build and smoke-test Docker image
        run: |
          docker build -t myon-fitness-server:ci .
          docker run -d --name fitness-ci -p 8720:8720 \
            -e FITNESS_APP_TOKEN=0123456789abcdef \
            myon-fitness-server:ci
          trap 'docker logs fitness-ci || true; docker rm -f fitness-ci || true' EXIT
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:8720/health | grep -q '"ok":true'; then
              echo "Container health check passed"
              exit 0
            fi
            sleep 0.5
          done
          echo "Container failed health check" >&2
          exit 1
